name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the build+test job only needs to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Match the npm major used locally to generate package-lock.json. Node 22
      # bundles npm 10, whose lockfile resolution differs from npm 11 and makes
      # `npm ci` reject the (npm 11-generated) lockfile.
      - name: Pin npm to 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Blocking: production dependencies (what ships in the image) must be free
      # of high/critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: full audit incl. dev tooling. Non-blocking so a CVE in a
      # dev-only dependency doesn't block unrelated PRs.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  integration-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lokalboards_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Match the npm major used locally to generate package-lock.json. Node 22
      # bundles npm 10, whose lockfile resolution differs from npm 11 and makes
      # `npm ci` reject the (npm 11-generated) lockfile.
      - name: Pin npm to 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DATABASE: lokalboards_test
        run: npm run test:integration

      - name: Run end-to-end tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DATABASE: lokalboards_test
        run: npm run test:e2e

  browser-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lokalboards_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Match the npm major used locally to generate package-lock.json. Node 22
      # bundles npm 10, whose lockfile resolution differs from npm 11 and makes
      # `npm ci` reject the (npm 11-generated) lockfile.
      - name: Pin npm to 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run browser (multiplayer) tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
          TEST_MYSQL_DATABASE: lokalboards_test
        run: npm run test:browser

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Validate that the production image still builds (catches Dockerfile
      # regressions, e.g. the HEALTHCHECK). Build only — no push.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: florianstrasser/lokalboards:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nix-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The Nix package takes its dependencies straight from package-lock.json,
      # so there is no hash to fall out of step with it any more. What this
      # guards is the step before that: `importNpmLock` has to be able to build
      # whatever shape the lockfile is in, and it has failed on this project
      # before — npm reaching for the registry mid-build, which a sandbox
      # forbids. Without this, that only ever surfaced when somebody tried to
      # install LokalBoards through Nix.
      - name: Build the Nix package
        run: nix build .#lokalboards --print-build-logs

      # The NixOS module is evaluated as part of a real system: option types,
      # the `environmentFile` assertion and the generated systemd unit all have
      # to hold together. Evaluating is not booting — see nix/module.nix — but
      # it catches everything short of runtime behaviour.
      - name: Evaluate the NixOS module
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = (flake.inputs.nixpkgs.lib.nixosSystem {
                system = builtins.currentSystem;
                modules = [
                  flake.nixosModules.lokalboards
                  {
                    boot.loader.grub.devices = [ "/dev/sda" ];
                    fileSystems."/" = { device = "/dev/sda1"; fsType = "ext4"; };
                    system.stateVersion = "24.05";
                    services.lokalboards = {
                      enable = true;
                      environmentFile = "/run/secrets/lokalboards.env";
                    };
                  }
                ];
              });
            in system.config.systemd.units."lokalboards.service".text
          '
